# vLLM Vision Server - Qwen3-VL and DeepSeek OCR
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-vision
  namespace: litellm
  labels:
    app: vllm-vision
    runtime: vllm
    owner: vision-team
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-vision
  template:
    metadata:
      labels:
        app: vllm-vision
        runtime: vllm
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.6.4
          ports:
            - containerPort: 8000
              name: http
          args:
            - "--model"
            - "Qwen/Qwen3-VL-235B-A22B-Thinking"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
            - "--max-model-len"
            - "262144"
            - "--dtype"
            - "fp8"
            - "--tensor-parallel-size"
            - "2"
            - "--enable-auto-tool-choice"
            - "--tool-call-parser"
            - "qwen"
          resources:
            limits:
              nvidia.com/gpu: 2
              memory: "128Gi"
            requests:
              nvidia.com/gpu: 2
              memory: "64Gi"
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-secrets
                  key: token
      nodeSelector:
        accelerator: nvidia-a100-80gb
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"

---
apiVersion: v1
kind: Service
metadata:
  name: vllm-vision
  namespace: litellm
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: vllm-vision
