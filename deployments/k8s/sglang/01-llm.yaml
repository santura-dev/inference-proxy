# SGLang LLM server example (Qwen 2.5 7B)

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sglang-llm
  namespace: inference
  labels:
    app: sglang-llm
    runtime: sglang
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sglang-llm
  template:
    metadata:
      labels:
        app: sglang-llm
        runtime: sglang
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "30000"
    spec:
      containers:
        - name: sglang
          image: lmsysorg/sglang:v0.3.0
          ports:
            - containerPort: 30000
              name: http
          args:
            - "--model-path"
            - "Qwen/Qwen2.5-7B-Instruct"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "30000"
            - "--tp"
            - "1"
            - "--enable-prefix-caching"
            - "--max-total-token"
            - "32768"
          resources:
            limits:
              nvidia.com/gpu: 1
              memory: "32Gi"
            requests:
              nvidia.com/gpu: 1
              memory: "16Gi"
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-secrets
                  key: token
          livenessProbe:
            httpGet:
              path: /health
              port: 30000
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 30000
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: sglang-llm
  namespace: inference
  labels:
    app: sglang-llm
spec:
  type: ClusterIP
  ports:
    - port: 30000
      targetPort: 30000
      name: http
  selector:
    app: sglang-llm
