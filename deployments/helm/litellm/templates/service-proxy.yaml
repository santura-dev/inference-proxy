apiVersion: v1
kind: Service
metadata:
  name: litellm-proxy
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "litellm.labels" . | nindent 4 }}
spec:
  type: {{ .Values.proxy.service.type }}
  ports:
    - port: {{ .Values.proxy.service.port }}
      targetPort: {{ .Values.proxy.service.port }}
      protocol: TCP
      name: http
    - port: {{ .Values.proxy.service.metricsPort }}
      targetPort: {{ .Values.proxy.service.metricsPort }}
      protocol: TCP
      name: metrics
  selector:
    {{- include "litellm.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
