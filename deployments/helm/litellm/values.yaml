# Default values for litellm-backend
# This file is managed by Helm. DO NOT edit manually.

global:
  # Global settings that apply to all components
  imageRegistry: ghcr.io
  imagePullSecrets:
    - name: registry-credentials

  # Domain for ingress
  domain: santura.dev

  # Namespace override (default: litellm)
  namespace: litellm

# LiteLLM Proxy Configuration
proxy:
  # Enable/disable proxy deployment
  enabled: true

  # Replica count
  replicas: 3

  # Image configuration
  image:
    repository: santura-dev/litellm-backend
    tag: latest
    pullPolicy: Always

  # Resource limits and requests
  resources:
    limits:
      cpu: "2"
      memory: "4Gi"
    requests:
      cpu: "500m"
      memory: "1Gi"

  # Service configuration
  service:
    type: ClusterIP
    port: 4000
    metricsPort: 4001

  # Ingress configuration
  ingress:
    enabled: true
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "50m"
      nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
      cert-manager.io/cluster-issuer: letsencrypt-prod

  # HPA configuration
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilization: 70
    targetMemoryUtilization: 80

  # Health check configuration
  livenessProbe:
    initialDelaySeconds: 10
    periodSeconds: 30
    failureThreshold: 3
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3

  # Environment variables
  env:
    LITELLM_LOG_LEVEL: info
    OTEL_SERVICE_NAME: litellm-proxy

  # Master key (should be provided via secrets)
  masterKey: ""

  # Node affinity
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Monitoring configuration
monitoring:
  enabled: true

  # Prometheus ServiceMonitor
  serviceMonitor:
    enabled: true
    namespace: monitoring
    interval: 30s
    scrapeTimeout: 10s
    labels:
      release: prometheus

  # Prometheus PodMonitor
  podMonitor:
    enabled: false
    namespace: monitoring
    interval: 30s
    labels:
      release: prometheus

  # Grafana dashboards
  dashboards:
    enabled: true
    namespace: monitoring
    labels:
      grafana_dashboard: "1"

# Redis configuration (for caching)
redis:
  enabled: true
  host: redis-master
  port: 6379
  password: ""
  existingSecret: redis-credentials

# Security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Network policies
networkPolicy:
  enabled: true
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

# Pod disruption budget
podDisruptionBudget:
  enabled: true
  minAvailable: 2

# RBAC configuration
rbac:
  create: true
  annotations: {}

# Service account
serviceAccount:
  create: true
  name: litellm
  annotations: {}

# Additional volumes
extraVolumes: []
# - name: config
#   configMap:
#     name: litellm-config

# Additional volume mounts
extraVolumeMounts: []
# - name: config
#   mountPath: /etc/litellm
#   readOnly: true
