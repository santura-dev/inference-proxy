{{- if and .Values.proxy.enabled .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "inferenceProxy.proxy.fullname" . }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "inferenceProxy.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "inferenceProxy.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: proxy
{{- end }}
