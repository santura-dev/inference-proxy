## inference-proxy configuration - model catalogue
## LiteLLM-style model_list: each entry maps a model name to a backend server.
## api_base uses the LiteLLM convention of including the /v1 prefix.

model_list:
  - model_name: llama-3.1-8b
    litellm_params:
      model: meta-llama/Llama-3.1-8B-Instruct
      api_base: http://vllm-llm:8000/v1
    model_info:
      mode: chat
      capabilities: ["chat", "tools"]
      priority: 1
      tags: ["llm", "vllm"]

  - model_name: qwen-7b
    litellm_params:
      model: Qwen/Qwen2.5-7B-Instruct
      api_base: http://sglang-llm:30000/v1
    model_info:
      mode: chat
      capabilities: ["chat", "tools"]
      priority: 2
      tags: ["llm", "sglang"]

  - model_name: bge-m3
    litellm_params:
      model: baai/bge-m3
      api_base: http://sglang-embed:30000/v1
    model_info:
      mode: embeddings
      capabilities: ["embeddings"]
      priority: 1
      tags: ["embedding", "sglang"]

general_settings:
  master_key: os.environ.INFERENCE_PROXY_MASTER_KEY
  stream_timeout: 30
  max_retries: 3
  retry_on_failure: true
