global:
  imageRegistry: ghcr.io
  imagePullSecrets:
    - name: registry-credentials
  domain: santura.dev
  namespace: inference

proxy:
  enabled: true
  replicas: 3

  image:
    repository: santura-dev/inference-proxy
    tag: latest
    pullPolicy: Always

  resources:
    limits:
      cpu: "2"
      memory: "4Gi"
    requests:
      cpu: "500m"
      memory: "1Gi"

  service:
    type: ClusterIP
    port: 4000

  ingress:
    enabled: true
    className: nginx
    tls:
      - hosts:
          - inference-api.santura.dev
        secretName: inference-tls
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "50m"
      nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
      cert-manager.io/cluster-issuer: letsencrypt-prod

  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilization: 70
    targetMemoryUtilization: 80

  livenessProbe:
    initialDelaySeconds: 10
    periodSeconds: 30
    failureThreshold: 3
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3

  env: {}

  # Provide via a secret in production. Empty disables request auth.
  masterKey: ""

  nodeSelector: {}
  tolerations: []
  affinity: {}

monitoring:
  enabled: true

  serviceMonitor:
    enabled: true
    namespace: monitoring
    interval: 30s
    scrapeTimeout: 10s
    labels:
      release: prometheus

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

networkPolicy:
  enabled: true
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

podDisruptionBudget:
  enabled: true
  minAvailable: 2
