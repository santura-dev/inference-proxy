# Open Model Ecosystem - ServingRuntime Definitions
# These define how models should be served (vLLM or SGLang)

---
# vLLM Serving Runtime - General purpose
apiVersion: omeloop.io/v1alpha1
kind: ServingRuntime
metadata:
  name: vllm-runtime
  labels:
    owner: ml-platform
    runtime: vllm
spec:
  name: vllm
  version: 0.6.4
  supportedModels:
    - namePattern: "nvidia-parakeet-*"
      endpointPrefix: audio
      port: 8000
      protocol: openai
    - namePattern: "baai-bge-m3"
      endpointPrefix: embed
      port: 8000
      protocol: openai
    - namePattern: "sentence-transformers-*"
      endpointPrefix: embed
      port: 8000
      protocol: openai
    - namePattern: "intfloat-*"
      endpointPrefix: embed
      port: 8000
      protocol: openai
    - namePattern: "qwen3-30b-a3b"
      endpointPrefix: llm
      port: 8000
      protocol: openai
    - namePattern: "qwen3-vl-*"
      endpointPrefix: vision
      port: 8000
      protocol: openai
    - namePattern: "deepseek-ocr"
      endpointPrefix: vision
      port: 8000
      protocol: openai
  container:
    image: vllm/vllm-openai:v0.6.4
    command: ["python", "-m", "vllm.entrypoints.openai.api_server"]
    args:
      - "--model"
      - "$(MODEL_NAME)"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--tensor-parallel-size"
      - "1"
      - "--max-model-len"
      - "$(CONTEXT_LENGTH)"
    resources:
      limits:
        nvidia.com/gpu: 1
        memory: "64Gi"
      requests:
        nvidia.com/gpu: 1
        memory: "32Gi"
    env:
      - name: HF_TOKEN
        valueFrom:
          secretKeyRef:
            name: hf-secrets
            key: token
      - name: VLLM_WORKER_MULTIPROC_METHOD
        value: "spawn"
    readinessProbe:
      httpGet:
        path: /health
        port: 8000
      initialDelaySeconds: 30
      periodSeconds: 10
    livenessProbe:
      httpGet:
        path: /health
        port: 8000
      initialDelaySeconds: 60
      periodSeconds: 30

---
# SGLang Serving Runtime - High performance
apiVersion: omeloop.io/v1alpha1
kind: ServingRuntime
metadata:
  name: sglang-runtime
  labels:
    owner: ml-platform
    runtime: sglang
spec:
  name: sglang
  version: 0.3.0
  supportedModels:
    - namePattern: "mistral-large-3-675b"
      endpointPrefix: llm
      port: 30000
      protocol: openai
    - namePattern: "openai-gpt-oss-120b"
      endpointPrefix: llm
      port: 30000
      protocol: openai
    - namePattern: "meta-llama-4-*"
      endpointPrefix: llm
      port: 30000
      protocol: openai
    - namePattern: "baai-bge-m3"
      endpointPrefix: embed
      port: 30000
      protocol: openai
  container:
    image: lmsysorg/sglang:v0.3.0
    command: ["python", "-m", "sglang.launch_server"]
    args:
      - "--model-path"
      - "$(MODEL_NAME)"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "30000"
      - "--tensor-parallel"
      - "1"
      - "--max-total-token"
      - "$(CONTEXT_LENGTH)"
    resources:
      limits:
        nvidia.com/gpu: 4
        memory: "256Gi"
      requests:
        nvidia.com/gpu: 4
        memory: "128Gi"
    env:
      - name: HF_TOKEN
        valueFrom:
          secretKeyRef:
            name: hf-secrets
            key: token
      - name: SGLANG_WORKER_MULTIPROC
        value: "true"
    readinessProbe:
      httpGet:
        path: /health
        port: 30000
      initialDelaySeconds: 60
      periodSeconds: 15
    livenessProbe:
      httpGet:
        path: /health
        port: 30000
      initialDelaySeconds: 120
      periodSeconds: 30

---
# vLLM Vision Runtime - For vision models
apiVersion: omeloop.io/v1alpha1
kind: ServingRuntime
metadata:
  name: vllm-vision-runtime
  labels:
    owner: ml-platform
    runtime: vllm-vision
spec:
  name: vllm-vision
  version: 0.6.4
  supportedModels:
    - namePattern: "qwen3-vl-235b"
      endpointPrefix: vision
      port: 8000
      protocol: openai
    - namePattern: "deepseek-ocr"
      endpointPrefix: vision
      port: 8000
      protocol: openai
    - namePattern: "meta-llama-4-maverick"
      endpointPrefix: llm
      port: 8000
      protocol: openai
  container:
    image: vllm/vllm-openai:v0.6.4
    command: ["python", "-m", "vllm.entrypoints.openai.api_server"]
    args:
      - "--model"
      - "$(MODEL_NAME)"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--tensor-parallel-size"
      - "1"
      - "--max-model-len"
      - "$(CONTEXT_LENGTH)"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "qwen"
    resources:
      limits:
        nvidia.com/gpu: 2
        memory: "128Gi"
      requests:
        nvidia.com/gpu: 2
        memory: "64Gi"
    env:
      - name: HF_TOKEN
        valueFrom:
          secretKeyRef:
            name: hf-secrets
            key: token
      - name: VLLM_WORKER_MULTIPROC_METHOD
        value: "spawn"
    readinessProbe:
      httpGet:
        path: /health
        port: 8000
      initialDelaySeconds: 30
      periodSeconds: 10
    livenessProbe:
      httpGet:
        path: /health
        port: 8000
      initialDelaySeconds: 60
      periodSeconds: 30
