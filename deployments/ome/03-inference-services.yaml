# Open Model Ecosystem - InferenceService Definitions
# These bind BaseModels to ServingRuntimes and expose endpoints

---
# Audio TTS Services
apiVersion: omeloop.io/v1alpha1
kind: InferenceService
metadata:
  name: nvidia-parakeet-tdt-0-6b-v3
  labels:
    owner: ml-platform
    category: audio
spec:
  baseModel: nvidia-parakeet-tdt-0-6b-v3
  runtime: vllm-runtime
  replicas: 1
  autoscaling:
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
  resources:
    limits:
      nvidia.com/gpu: 1
      memory: "32Gi"
    requests:
      nvidia.com/gpu: 1
      memory: "16Gi"

---
